bot_settings:
  email: "${PARARIUS_EMAIL}"
  password: "${PARARIUS_PASSWORD}"
  debug: False # True = dry run: find matches but never submit or notify
  headless: True # False = show the browser window (independent of debug)
  chrome_profile_dir: ".chrome-profile" # keeps cookies between runs; "" to disable
  time_between_requests: 2
  time_between_runs: 15

locations:
  default:
    url: "https://www.pararius.com/huurwoningen"
    min_price: 800
    max_price: 1500
    message: "Hi!
      My name is Lorenzo Onorato, I'm 25 and originally from Italy.
      I recently graduated with a Master's in Aerospace Engineering from TU Delft, and I'm about to start a new position as a Data Analyst in Huismann.
      I consideer myself to be a reliable, tidy tenant and now I am looking for a stable place to settle into this next chapter. 
      Outside of work,  mostlyI enjoy cooking, staying active, and spending time with friends.

      I'd love the opportunity to view the property and would be happy to provide references or any additional documents you might need.
      Looking forward to hearing from you!
      
      Best regards,   
      Lorenzo Onorato"
    applied_listings_location: "applied_listings"
  # schiedam:
  rotterdam:

# Remove this whole section to fall back to console-only notifications.
telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}" # from @BotFather, read from .env
  receivers:
    # User:
    #   chat_id: "123456789"
    #   message: "Applied to {url} with price {price} in {location}"
    Alex:
      # Your own chat id: message the bot once, then run
      # `python telegram_setup.py` to print it.
      chat_id: "${TELEGRAM_CHAT_ID}"
      message: "Applied to {url} with price {price} in {location}"


